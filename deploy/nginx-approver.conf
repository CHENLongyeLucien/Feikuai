server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:8545 https://api.avax-test.network; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location / {try_files $uri $uri/ /index.html;}
}
