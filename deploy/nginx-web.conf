server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  client_max_body_size 34m;
  location /api/ {proxy_pass http://api:3001; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 3600s;}
  location /health {proxy_pass http://api:3001;}
  location / {try_files $uri $uri/ /index.html;}
}
